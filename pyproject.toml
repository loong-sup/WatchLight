[build-system]
requires = ["setuptools>=68", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "watchlight"
version = "0.1.0"
requires-python = ">=3.11"
description = "Watchlight — personal intelligence tracking & decision assistant (Python backend)"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "pydantic>=2.9",
    "typer>=0.12",
    "httpx>=0.27",
    "structlog>=24",
    "anyio>=4",
    "pyjson5>=1.6",
    "aiofiles>=24",
    "watchfiles>=0.24",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.35",
    "ruff>=0.7",
    "mypy>=1.12",
    "coverage>=7",
]

[project.scripts]
watchlight = "watchlight.cli.main:app"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.mypy]
strict = true
python_version = "3.11"
